# Orbix Declare · produção na droplet (s-1vcpu-1gb + 2 GB de swap)
# Uso: docker compose --env-file compose.env up -d
# ORBIX_IMAGE vem do registry (build no GitHub Actions). Nunca buildar na droplet.

x-hardening: &hardening
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  api:
    <<: *hardening
    image: ${ORBIX_IMAGE:?defina ORBIX_IMAGE}
    env_file: ./api.env            # SEM a chave da carteira de memo
    expose: ["8000"]
    depends_on:
      redis: { condition: service_healthy }
    mem_limit: 320m
    networks: [edge, internal]

  worker:
    <<: *hardening
    image: ${ORBIX_IMAGE:?defina ORBIX_IMAGE}
    command: ["arq", "orbix.worker.WorkerSettings"]
    env_file: ./worker.env         # único serviço com SOLANA_MEMO_SECRET_KEY
    depends_on:
      redis: { condition: service_healthy }
    mem_limit: 320m
    healthcheck:
      disable: true
    networks: [internal, egress]   # egress: Helius, Hyperliquid, Anthropic, RPC

  redis:
    <<: *hardening
    image: redis:7.4-alpine
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?defina REDIS_PASSWORD}
      - --maxmemory
      - 96mb
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
      - --rename-command
      - FLUSHALL
      - ""
      - --rename-command
      - CONFIG
      - ""
    user: "999:999"
    read_only: false               # precisa gravar o AOF em /data
    volumes: [redis_data:/data]
    expose: ["6379"]
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [internal]

  caddy:
    <<: *hardening
    image: caddy:2.10-alpine
    cap_add: [NET_BIND_SERVICE]
    ports:
      - "80:80"
      - "443:443"                  # únicas portas publicadas
    environment:
      API_DOMAIN: ${API_DOMAIN:?defina API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    mem_limit: 96m
    networks: [edge]

networks:
  edge: {}                         # Caddy ↔ API (e saída da API para JWKS/Anthropic)
  egress: {}                       # saída do worker
  internal:
    internal: true                 # sem saída para a internet a partir do Redis

volumes:
  redis_data: {}
  caddy_data: {}
  caddy_config: {}
