[project]
name = "orbix"
version = "0.1.0"
description = "Orbix Declare API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "arq>=0.28.0",
    "asyncpg>=0.31.0",
    "boto3>=1.43.107",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "openai>=3.23.0",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "pyjwt[crypto]>=2.15.1",
    "slowapi>=0.1.10",
    "solders>=0.29.0",
    "structlog>=26.1.0",
    "tzdata>=2026.4",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orbix"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# S = regras de segurança (bandit), B = bugs comuns, UP = sintaxe moderna
select = ["E", "F", "I", "B", "S", "UP", "N", "SIM", "RUF", "ASYNC"]
ignore = ["B008", "N818"]  # Depends() em default é o padrão do FastAPI; exceções sem sufixo Error

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S608", "E501"]
"tests/conftest.py" = ["S101", "S105", "S106", "E402", "E501"]  # ambiente definido antes dos imports
"scripts/**" = ["S101", "S603", "S607", "E741", "E501"]  # ferramentas de operação, fora da aplicação
"src/orbix/auth/mailer.py" = ["E501"]  # HTML do e-mail em linhas longas

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["slowapi.*", "arq.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.31.3",
    "bandit>=1.9.4",
    "boto3-stubs[s3]>=1.43.106",
    "fakeredis>=2.39.0",
    "hypothesis>=6.168.3",
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.9",
    "sqlalchemy[asyncio]>=2.1.1",
    "types-boto3>=1.43.106",
]
